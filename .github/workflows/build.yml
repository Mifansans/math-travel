name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build main.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Build diary.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: diary.tex
          working_directory: diary
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            main.pdf
            diary/diary.pdf

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.pdf
            diary/diary.pdf
